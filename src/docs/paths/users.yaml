paths:
  /api/users:
    get:
      tags:
        - "Users"
      operationId: "listUsers"
      summary: "Listar perfiles"
      description: "Solo page y limit; se rechazan campos desconocidos. Orden por _id ascendente."
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: "Operación completada"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
              example:
                status: "success"
                payload:
                  - firstName: "Alex"
                    lastName: "Ejemplo"
                    email: "alex@example.test"
                    role: "user"
                    _id: "000000000000000000000001"
                    id: "000000000000000000000001"
                    createdAt: "2026-01-01T12:00:00.000Z"
                    updatedAt: "2026-01-01T12:00:00.000Z"
                totalPages: 1
                page: 1
                hasPrevPage: false
                hasNextPage: false
                prevPage: null
                nextPage: null
                prevLink: null
                nextLink: null
        "400":
          $ref: "#/components/responses/PaginationError"
        "500":
          $ref: "#/components/responses/DATABASE_ERROR"
    post:
      tags:
        - "Users"
      operationId: "createUser"
      summary: "Crear perfil"
      description: "Acepta role=user o driver; si se omite, asigna user. No acepta admin, password, IDs ni otros campos extra. Los textos se recortan y email se normaliza a minúsculas."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: "Operación completada"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResult"
              example:
                status: "success"
                payload:
                  firstName: "Alex"
                  lastName: "Ejemplo"
                  email: "alex@example.test"
                  role: "user"
                  _id: "000000000000000000000001"
                  id: "000000000000000000000001"
                  createdAt: "2026-01-01T12:00:00.000Z"
                  updatedAt: "2026-01-01T12:00:00.000Z"
        "400":
          $ref: "#/components/responses/UserInputError"
        "409":
          $ref: "#/components/responses/USER_ALREADY_EXISTS"
        "413":
          $ref: "#/components/responses/PAYLOAD_TOO_LARGE"
        "500":
          $ref: "#/components/responses/DATABASE_ERROR"
  /api/users/{uid}:
    get:
      tags:
        - "Users"
      operationId: "getUser"
      summary: "Consultar perfil"
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: "Operación completada"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResult"
              example:
                status: "success"
                payload:
                  firstName: "Alex"
                  lastName: "Ejemplo"
                  email: "alex@example.test"
                  role: "user"
                  _id: "000000000000000000000001"
                  id: "000000000000000000000001"
                  createdAt: "2026-01-01T12:00:00.000Z"
                  updatedAt: "2026-01-01T12:00:00.000Z"
        "400":
          $ref: "#/components/responses/InvalidId"
        "404":
          $ref: "#/components/responses/USER_NOT_FOUND"
        "500":
          $ref: "#/components/responses/DATABASE_ERROR"
    put:
      tags:
        - "Users"
      operationId: "updateUser"
      summary: "Actualizar campos de perfil"
      description: "Subconjunto no vacío de firstName, lastName y email. No permite modificar role ni IDs."
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: "Operación completada"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResult"
              example:
                status: "success"
                payload:
                  firstName: "Luz"
                  lastName: "Ejemplo"
                  email: "alex@example.test"
                  role: "user"
                  _id: "000000000000000000000001"
                  id: "000000000000000000000001"
                  createdAt: "2026-01-01T12:00:00.000Z"
                  updatedAt: "2026-01-01T12:00:00.000Z"
        "400":
          $ref: "#/components/responses/UserUpdateError"
        "404":
          $ref: "#/components/responses/USER_NOT_FOUND"
        "409":
          $ref: "#/components/responses/USER_ALREADY_EXISTS"
        "413":
          $ref: "#/components/responses/PAYLOAD_TOO_LARGE"
        "500":
          $ref: "#/components/responses/DATABASE_ERROR"
    delete:
      tags:
        - "Users"
      operationId: "deleteUser"
      summary: "Eliminar perfil"
      description: "Devuelve 200 con el perfil eliminado en payload."
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: "Operación completada"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResult"
              example:
                status: "success"
                payload:
                  firstName: "Alex"
                  lastName: "Ejemplo"
                  email: "alex@example.test"
                  role: "user"
                  _id: "000000000000000000000001"
                  id: "000000000000000000000001"
                  createdAt: "2026-01-01T12:00:00.000Z"
                  updatedAt: "2026-01-01T12:00:00.000Z"
        "400":
          $ref: "#/components/responses/InvalidId"
        "404":
          $ref: "#/components/responses/USER_NOT_FOUND"
        "500":
          $ref: "#/components/responses/DATABASE_ERROR"
  /api/users/{uid}/documents:
    post:
      tags: [Users]
      operationId: addUserDocument
      summary: Asociar documento privado a un perfil
      description: "Un archivo, máximo 5 MiB inclusivos (5242880 bytes). PDF, JPEG o PNG con MIME y firma compatibles. type obligatorio; driver_license admite solo PDF y perfil driver. El orden de los campos no importa. Guarda en disco privado y asocia metadatos mediante push atómico. Devuelve solo la nueva asociación. Sin autenticación: usar exclusivamente archivos ficticios. MongoDB y disco no comparten transacción; un resultado ambiguo conserva el archivo para reconciliación."
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUpload'
            encoding:
              document:
                contentType: application/pdf, image/jpeg, image/png
      responses:
        '201':
          description: Archivo guardado y asociación confirmada
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUploadResult'
              example:
                status: success
                payload:
                  userId: '000000000000000000000001'
                  document:
                    originalName: ficticio.pdf
                    filename: 00000000-0000-4000-8000-000000000001.pdf
                    path: uploads/documents/00000000-0000-4000-8000-000000000001.pdf
                    mimeType: application/pdf
                    size: 42
                    type: user_document
                    uploadedAt: '2026-01-01T12:00:00.000Z'
        '400':
          $ref: '#/components/responses/DocumentUploadError'
        '404':
          $ref: '#/components/responses/USER_NOT_FOUND'
        '413':
          $ref: '#/components/responses/FILE_TOO_LARGE'
        '415':
          $ref: '#/components/responses/INVALID_FILE_TYPE'
        '500':
          $ref: '#/components/responses/FileStorageError'
